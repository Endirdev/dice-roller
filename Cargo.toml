[package]
name = "dice"
version = "0.1.0"
edition = "2021"
description = "Roll n dice with x sides until all match (optimized Rust port)"

[[bin]]
name = "dice"
path = "src/main.rs"

[[bin]]
name = "dice-gui"
path = "src/bin/dice_gui.rs"

[dependencies]
clap = { version = "4.5", features = ["derive"] }
rand = "0.9"
ctrlc = "3.4"
eframe = "0.36.2"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
